<ui:composition template="/WEB-INF/templates/navbar_template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="conteudo">
        <h:outputStylesheet library="css" name="form.css"/>
        <h:outputStylesheet library="css" name="conteudo_rico.css"/>
        <h:outputStylesheet library="css" name="view_tarefa.css"/>
        <h:outputStylesheet library="css" name="comentarios.css"/>

        <main class="main-content">
            <h:panelGroup id="bodyContent" layout="block" styleClass="view-container">

                <div class="view-header">
                    <div class="header-info">
                        <span class="task-id">Tarefa ##{tarefaBean.tarefa.id}</span>
                        <h1>#{tarefaBean.tarefa.titulo}</h1>
                    </div>

                    <h:form id="form-op" styleClass="header-actions">
                        <p:selectOneMenu value="#{tarefaBean.tarefa.status}"
                                         styleClass="custom-select-min status-select">
                            <f:converter converterId="statusConverter"/>
                            <f:selectItems value="#{tarefaBean.niveisStatus}"/>
                            <p:ajax event="change" update=":bodyContent" listener="#{tarefaBean.moverTarefa}"/>
                        </p:selectOneMenu>

                        <p:commandButton ajax="false" action="#{tarefaBean.editar}"
                                         icon="fa fa-edit" styleClass="btn-outline"
                                         rendered="#{loginBean.logado.adm}"/>

                        <p:commandButton action="#{tarefaBean.remover}"
                                         icon="fa fa-trash" styleClass="btn-danger"
                                         rendered="#{loginBean.logado.adm}">
                            <p:confirm header="Remover tarefa" message="Deseja excluir permanentemente?"/>
                        </p:commandButton>
                    </h:form>
                </div>

                <p:tabView id="task-tabs" styleClass="task-tabs">
                    <p:tab title="Detalhes">
                <div class="view-grid">
                    <div class="view-main">
                        <div class="detail-card">
                            <label class="field-label-min">Descrição da Atividade</label>
                            <div class="description-text">
                                <h:outputText value="#{tarefaBean.tarefa.descricao}" escape="false"/>
                            </div>
                        </div>

                        <ui:include src="/WEB-INF/fragments/comentarios_tarefa.xhtml" />
                    </div>

                    <div class="view-sidebar">
                        <div class="detail-card">
                            <div class="info-row">
                                <label>Responsável</label>
                                <span class="responsible-identity">
                                    <h:panelGroup rendered="#{tarefaBean.tarefa.responsavel != null and tarefaBean.tarefa.responsavel.usuario != null and tarefaBean.tarefa.responsavel.usuario.id != null}">
                                        <img class="profile-avatar task-avatar" src="#{request.contextPath}/avatar?id=#{tarefaBean.tarefa.responsavel.usuario.id}"
                                             onerror="this.onerror=null;this.src='#{request.contextPath}/resources/img/profile-placeholder.svg';" alt="" />
                                    </h:panelGroup>
                                    #{tarefaBean.tarefa.responsavel == null ? 'Não atribuída' : tarefaBean.tarefa.responsavel.nome}
                                    <p:commandLink action="#{tarefaBean.delegar}" update=":bodyContent"
                                                   styleClass="action-link" value="#{tarefaBean.campoAtribuir}"/>
                                </span>
                            </div>

                            <div class="info-row">
                                <label>Prioridade</label>
                                <span class="badge-priority">#{tarefaBean.tarefa.prioridade}</span>
                            </div>

                            <div class="info-row">
                                <label>Equipe</label>
                                <span>#{tarefaBean.tarefa.equipe.nome}</span>
                            </div>

                            <div class="info-row">
                                <label>Prazo Final</label>
                                <span class="text-date">
                                    <i class="fa fa-calendar-o"></i>
                                    <h:outputText value="#{tarefaBean.tarefa.deadline}">
                                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                                    </h:outputText>
                                </span>
                            </div>
                        </div>

                        <a href="#{request.contextPath}/restricted/listaTarefa.jsf" class="btn-back-full">
                            <i class="fa fa-arrow-left"></i> Voltar ao Quadro
                        </a>
                    </div>
                </div>
                    </p:tab>

                    <p:tab title="Histórico">
                        <div class="detail-card history-card">
                            <p:dataTable value="#{tarefaBean.historicoTarefa}" var="evento"
                                         rendered="#{not empty tarefaBean.historicoTarefa}"
                                         styleClass="history-table" emptyMessage="Nenhuma alteração registrada.">
                                <p:column headerText="Quando">
                                    <h:outputText value="#{evento.dataAlteracao}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Quem">
                                    <span class="history-author">
                                        <h:panelGroup rendered="#{evento.usuario != null}">
                                            <img class="profile-avatar history-avatar"
                                                 src="#{request.contextPath}/avatar?id=#{evento.usuario.id}"
                                                 onerror="this.onerror=null;this.src='#{request.contextPath}/resources/img/profile-placeholder.svg';"
                                                 alt="" />
                                        </h:panelGroup>
                                        <h:outputText value="#{evento.autorNome}"/>
                                    </span>
                                </p:column>
                                <p:column headerText="O que mudou">
                                    <strong><h:outputText value="#{evento.campo}"/></strong>
                                    <div class="history-change">
                                        <h:outputText value="#{evento.valorAnterior}"/> →
                                        <h:outputText value="#{evento.valorNovo}"/>
                                    </div>
                                </p:column>
                            </p:dataTable>
                            <h:panelGroup rendered="#{empty tarefaBean.historicoTarefa}" layout="block" styleClass="history-empty">
                                Nenhuma alteração registrada até o momento.
                            </h:panelGroup>
                        </div>
                    </p:tab>
                </p:tabView>
            </h:panelGroup>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no btn-outline"/>
                <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes btn-danger"/>
            </p:confirmDialog>
        </main>
    </ui:define>
</ui:composition>
