<ui:composition template="/WEB-INF/templates/navbar_template.xhtml"
				xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:p="http://primefaces.org/ui"
				xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

	<ui:define name="conteudo">
		<h:outputStylesheet library="css" name="form.css" />

		<main class="main-content">
			<div class="search-bar-card">
				<h:form id="formBusca">
					<p:messages id="messages" closable="true"><p:autoUpdate /></p:messages>

					<div class="search-grid">
						<div class="search-item">
							<p:outputLabel value="Número" styleClass="field-label-min" />
							<p:inputText value="#{tarefaBean.formConsulta.numero}" placeholder="ID" />
						</div>
						<div class="search-item flex-2">
							<p:outputLabel value="Título" styleClass="field-label-min" />
							<p:inputText value="#{tarefaBean.formConsulta.titulo}" placeholder="O que busca?" />
						</div>
						<div class="search-item">
							<p:outputLabel value="Responsável" styleClass="field-label-min" />
							<p:selectOneMenu value="#{tarefaBean.formConsulta.responsavel}" styleClass="custom-select-min">
								<f:selectItem itemLabel="Todos" itemValue="#{null}" />
								<f:converter converterId="responsavelConverter" />
								<f:selectItems value="#{tarefaBean.comboResponsaveis}" />
							</p:selectOneMenu>
						</div>
						<div class="search-button-area">
							<p:commandButton action="#{tarefaBean.listar}"
											 icon="fa fa-search"
											 update="messages :kanbanBoard"
											 process="@form"
											 styleClass="btn-circle" />
						</div>
					</div>
				</h:form>
			</div>

			<div class="equipe-header">
				<span class="equipe-label">Equipe</span>
				<h2 class="equipe-title">#{tarefaBean.formConsulta.equipe.nome}</h2>
			</div>

			<h:panelGroup id="kanbanBoard" layout="block">
				<div class="kanban-wrapper">
					<div class="kanban-col">
						<div class="col-header">
							<span class="dot backlog-dot"></span> Backlog
						</div>
						<ui:repeat value="#{tarefaBean.getObjectsForKey(3)}" var="t">
							<p:commandLink action="#{tarefaBean.visualizarTarefa}" styleClass="task-card-modern">
								<div class="task-id-tag">##{t.id}</div>
								<div class="task-content">#{t.titulo}</div>
								<f:setPropertyActionListener
										target="#{tarefaBean.tarefa}"
										value="#{t}" />
							</p:commandLink>
						</ui:repeat>
					</div>

					<div class="kanban-col">
						<div class="col-header">
							<span class="dot andamento-dot"></span> Em Andamento
						</div>
						<ui:repeat value="#{tarefaBean.getObjectsForKey(1)}" var="t">
							<p:commandLink action="#{tarefaBean.visualizarTarefa}" styleClass="task-card-modern">
								<div class="task-id-tag">##{t.id}</div>
								<div class="task-content">#{t.titulo}</div>
								<f:setPropertyActionListener
										target="#{tarefaBean.tarefa}"
										value="#{t}" />
							</p:commandLink>
						</ui:repeat>
					</div>

					<div class="kanban-col">
						<div class="col-header">
							<span class="dot concluido-dot"></span> Concluído
						</div>
						<ui:repeat value="#{tarefaBean.getObjectsForKey(2)}" var="t">
							<p:commandLink action="#{tarefaBean.visualizarTarefa}" styleClass="task-card-modern">
								<div class="task-id-tag">##{t.id}</div>
								<div class="task-content">#{t.titulo}</div>
								<f:setPropertyActionListener
										target="#{tarefaBean.tarefa}"
										value="#{t}" />
							</p:commandLink>
						</ui:repeat>
					</div>
				</div>
			</h:panelGroup>
		</main>
	</ui:define>
</ui:composition>
