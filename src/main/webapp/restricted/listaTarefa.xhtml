<ui:composition template="/WEB-INF/templates/navbar_template.xhtml"
				xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:p="http://primefaces.org/ui"
				xmlns:ui="http://java.sun.com/jsf/facelets">

	<ui:define name="conteudo">
		<h:outputStylesheet library="css" name="form.css" />
		<h:outputStylesheet library="css" name="quadro_kanban.css" />
		<h:outputScript library="js" name="kanban-dnd.js" target="head" />

		<main class="main-content">
			<div class="page-header">
				<h1>Quadro da equipe</h1>
				<p>Organize as tarefas por etapa e acompanhe o andamento.</p>
			</div>
			<div class="search-bar-card">
				<h:form id="formBusca">
					<p:messages id="messages" closable="true"><p:autoUpdate /></p:messages>

					<div class="search-grid">
						<div class="search-item">
							<p:outputLabel for="numero" value="Número" styleClass="field-label-min" />
							<p:inputText id="numero" value="#{tarefaBean.formConsulta.numero}" placeholder="ID" />
						</div>
						<div class="search-item flex-2">
							<p:outputLabel for="texto" value="Título ou descrição" styleClass="field-label-min" />
							<p:inputText id="texto" value="#{tarefaBean.formConsulta.titulo}" placeholder="O que busca?" />
						</div>
						<div class="search-item">
							<p:outputLabel for="responsavel" value="Responsável" styleClass="field-label-min" />
							<p:selectOneMenu id="responsavel" value="#{tarefaBean.formConsulta.responsavel}" styleClass="custom-select-min">
								<f:selectItem itemLabel="Todos" itemValue="#{null}" />
								<f:converter converterId="responsavelConverter" />
								<f:selectItems value="#{tarefaBean.comboResponsaveis}" />
							</p:selectOneMenu>
						</div>
						<div class="search-item">
							<p:outputLabel for="status" value="Status" styleClass="field-label-min" />
							<p:selectOneMenu id="status" value="#{tarefaBean.formConsulta.situacao}" styleClass="custom-select-min">
								<f:selectItem itemLabel="Todos" itemValue="#{null}" />
								<f:selectItems value="#{tarefaBean.niveisStatus}" />
							</p:selectOneMenu>
						</div>
						<div class="search-item">
							<p:outputLabel for="prioridade" value="Prioridade" styleClass="field-label-min" />
							<p:selectOneMenu id="prioridade" value="#{tarefaBean.formConsulta.prioridade}" styleClass="custom-select-min">
								<f:selectItem itemLabel="Todas" itemValue="#{null}" />
								<f:selectItems value="#{tarefaBean.prioridadesConsulta}" />
							</p:selectOneMenu>
						</div>
						<div class="search-item">
							<p:outputLabel for="prazoDe" value="Prazo de" styleClass="field-label-min" />
							<p:calendar id="prazoDe" value="#{tarefaBean.formConsulta.prazoDe}" pattern="dd/MM/yyyy" mask="true" />
						</div>
						<div class="search-item">
							<p:outputLabel for="prazoAte" value="Prazo até" styleClass="field-label-min" />
							<p:calendar id="prazoAte" value="#{tarefaBean.formConsulta.prazoAte}" pattern="dd/MM/yyyy" mask="true" />
						</div>
						<div class="search-button-area">
							<p:commandButton action="#{tarefaBean.listar}"
											 icon="fa fa-search"
											 update="messages :kanbanBoard"
											 process="@form"
										 value="Buscar"
										 title="Buscar tarefas"
										 styleClass="btn-outline" />
							<p:commandButton action="#{tarefaBean.limparFiltros}"
										 icon="fa fa-times"
										 value="Limpar"
										 update="@form :kanbanBoard"
										 process="@this"
										 styleClass="btn-outline" />
						</div>
					</div>

					<p:remoteCommand name="moverTarefaKanban"
									 action="#{tarefaBean.moverTarefaArrastada}"
									 process="@this"
									 update="messages :kanbanBoard" />
				</h:form>
			</div>

			<div class="equipe-header">
				<span class="equipe-label">Equipe</span>
				<h2 class="equipe-title">#{tarefaBean.formConsulta.equipe.nome}</h2>
			</div>

			<h:panelGroup id="kanbanBoard" layout="block">
				<div class="kanban-wrapper" role="region" aria-label="Tarefas organizadas por status" tabindex="0">
					<ui:include src="/WEB-INF/fragments/coluna_kanban.xhtml">
						<ui:param name="columnStatus" value="#{3}" />
						<ui:param name="columnLabel" value="Backlog" />
						<ui:param name="columnStyle" value="backlog" />
					</ui:include>
					<ui:include src="/WEB-INF/fragments/coluna_kanban.xhtml">
						<ui:param name="columnStatus" value="#{1}" />
						<ui:param name="columnLabel" value="Em Andamento" />
						<ui:param name="columnStyle" value="andamento" />
					</ui:include>
					<ui:include src="/WEB-INF/fragments/coluna_kanban.xhtml">
						<ui:param name="columnStatus" value="#{2}" />
						<ui:param name="columnLabel" value="Concluído" />
						<ui:param name="columnStyle" value="concluido" />
					</ui:include>
				</div>
			</h:panelGroup>
		</main>
	</ui:define>
</ui:composition>
