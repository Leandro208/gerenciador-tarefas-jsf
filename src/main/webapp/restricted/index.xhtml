<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui"
				template="/WEB-INF/templates/navbar_template.xhtml">

	<ui:define name="titulo">Gerenciador de Tarefas</ui:define>

	<ui:define name="conteudo">
		<h:outputStylesheet library="css" name="inicio.css" />

		<main class="main-content">
			<div class="page-header">
				<h1>Gerenciador de Tarefas</h1>
				<p style="color: #6b7280;">Acompanhe o progresso da sua equipe em tempo real.</p>
			</div>

			<h:panelGroup id="monitor" layout="block" styleClass="dashboard-grid">
				<div class="stat-card">
					<div class="icon-circle bg-andamento">
						<i class="pi pi-sync"></i>
					</div>
					<div class="stat-info">
						<span>Em Andamento</span>
						<h:outputText value="#{tarefaBean.monitor.andamento}" styleClass="stat-value" />
					</div>
				</div>

				<div class="stat-card">
					<div class="icon-circle bg-concluido">
						<i class="pi pi-check-circle"></i>
					</div>
					<div class="stat-info">
						<span>Concluídas</span>
						<h:outputText value="#{tarefaBean.monitor.concluidas}" styleClass="stat-value" />
					</div>
				</div>
			</h:panelGroup>

			<p:poll interval="2" listener="#{tarefaBean.dashboard}" update="monitor" />

			<div class="actions-panel">
				<h3 style="margin-top: 0; margin-bottom: 20px; font-size: 16px;">Ações Rápidas</h3>
				<h:form id="formInicio" styleClass="actions-grid">
					<p:commandButton action="#{tarefaBean.entrarCadastro}" value="Nova Tarefa"
									 icon="fa fa-plus" rendered="#{loginBean.responsavel.adm}" />

					<p:linkButton href="adm/formEquipe.jsf" value="Criar Equipe"
								  icon="fa fa-users" rendered="#{loginBean.responsavel.adm}" />

					<p:commandButton action="#{tarefaBean.visualizarQuadro}" value="Minha Equipe"
									 icon="fa fa-th-large" rendered="#{loginBean.responsavel.equipe != null}"
									 styleClass="ui-button-success" />

					<p:commandButton value="Usuários" icon="fa fa-user-circle"
									 rendered="#{loginBean.responsavel.adm}" onclick="PF('dialogUsuarios').show();"
									 type="button" />

					<p:commandButton value="Ver Equipes" icon="fa fa-list-ul"
									 rendered="#{loginBean.responsavel.adm}" onclick="PF('dialogEquipes').show();"
									 type="button" />
				</h:form>
			</div>
		</main>

		<p:dialog header="Equipes Registradas" widgetVar="dialogEquipes" modal="true" responsive="true" width="450">
			<p:dataTable var="equipe" value="#{equipeBean.listaEquipes}" size="small">
				<p:column headerText="Equipe">
					<p:commandLink value="#{equipe.nome}" action="#{tarefaBean.visualizarQuadro(equipe)}"
								   style="color: var(--primary); font-weight: 500;" />
				</p:column>
			</p:dataTable>
		</p:dialog>

		<p:dialog header="Gestão de Responsáveis" widgetVar="dialogUsuarios" modal="true" responsive="true" width="600">
			<p:dataTable var="r" value="#{responsavelBean.listaReponsaveis}" size="small" paginator="true" rows="5">
				<p:column headerText="ID" width="50"><h:outputText value="#{r.id}" /></p:column>
				<p:column headerText="Nome"><h:outputText value="#{r.nome}" /></p:column>
				<p:column headerText="Opções" width="100">
					<h:form>
						<p:commandButton ajax="false" action="#{responsavelBean.alterarFuncao(r)}"
										 disabled="#{r.adm}" icon="fa fa-shield"
										 styleClass="rounded-button" title="Tornar Admin" />

						<p:commandButton ajax="false" action="#{responsavelBean.alterarFuncao(r)}"
										 disabled="#{!r.adm}" icon="fa fa-user"
										 styleClass="rounded-button" title="Tornar Usuário" />
					</h:form>
				</p:column>
			</p:dataTable>
		</p:dialog>

		<f:event type="preRenderView" listener="#{tarefaBean.limpar}" />
	</ui:define>

</ui:composition>
