<ui:composition template="/WEB-INF/templates/navbar_template.xhtml"
				xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui">

    <ui:define name="conteudo">
        <h:outputStylesheet library="css" name="form.css" />

        <main class="main-content">
            <div class="form-card">
                <h2>Nova Equipe</h2>
                <p class="subtitle">Cadastre os dados da nova equipe.</p>

                <h:form id="formCadastro">
                    <p:messages id="msgs" closable="true" showDetail="false" showSummary="true">
                        <p:autoUpdate />
                    </p:messages>

                    <h:outputLabel value="Nome da Equipe" styleClass="field-label" />
                    <p:inputText value="#{equipeBean.equipe.nome}" required="true"
                                 placeholder="Ex: Desenvolvimento" />

                    <p:commandButton value="Salvar"
                                     action="#{equipeBean.cadastrar}"
                                     styleClass="btn-primary"
                                     icon="fa fa-check"
                                     update="@form"
                                     process="@form" />
                </h:form>
            </div>

            <h:link outcome="/restricted/index" styleClass="back-link">
                <i class="fa fa-arrow-left"></i> Voltar ao Dashboard
            </h:link>
        </main>
    </ui:define>
</ui:composition>
