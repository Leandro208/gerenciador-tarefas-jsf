<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title><ui:insert name="titulo">Gerenciador de Tarefas</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet" />
    <h:outputStylesheet library="css" name="global.css" />
    <h:outputStylesheet library="css" name="superficies.css" />
</h:head>
<h:body>
    <header class="navbar">
        <h:link outcome="/restricted/index" styleClass="brand-lockup">
            <h:graphicImage library="img" name="icon.png" width="38" height="38" alt="" />
            <span class="brand-wordmark">Gerenciador de Tarefas</span>
        </h:link>
        <h:link outcome="/restricted/perfil" styleClass="user-profile user-profile-link" title="Meu Perfil">
            <span class="profile-avatar user-avatar">
                <img src="#{request.contextPath}/avatar?id=#{loginBean.logado.id}"
                     onerror="this.onerror=null;this.src='#{request.contextPath}/resources/img/profile-placeholder.svg';" alt="" />
            </span>
            <span class="user-identity">
                <h:outputText value="#{loginBean.logado.nome}" styleClass="user-name" />
                <span class="role-badge">#{loginBean.logado.funcao}</span>
            </span>
        </h:link>
        <h:form styleClass="logout-form">
            <p:commandButton action="#{loginBean.logout}" icon="fa fa-sign-out" styleClass="btn-logout" title="Sair" />
        </h:form>
    </header>

    <div class="container-principal">
        <ui:insert name="conteudo" />
    </div>
</h:body>
</html>
