<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Login | Gerenciador de Tarefas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <h:outputStylesheet library="css" name="login.css" />
</h:head>

<h:body>
    <div class="brand-side">
        <div class="brand-logo">
            <h:graphicImage library="img" name="icon.png" width="36" height="36" />
        </div>
        <h2 class="brand-title">Gerencie seus projetos com <br/><strong>eficiência e simplicidade.</strong></h2>
        <p class="brand-desc">Organize tarefas, acompanhe prazos e colabore com sua equipe em tempo real.</p>
    </div>

    <div class="form-side">
        <div class="login-header">
            <h1>Entrar na conta</h1>
            <p>Informe seus dados de acesso abaixo.</p>
        </div>

        <h:form id="loginForm">
            <p:messages id="messages" closable="true" />

            <h:outputLabel for="email" value="Endereço de e-mail" styleClass="field-label" />
            <p:inputText id="email" value="#{loginBean.email}" required="true"
                         placeholder="nome@empresa.com" />

            <div class="field-header-row">
                <h:outputLabel for="password" value="Senha" styleClass="field-label" style="margin: 0;" />
                <p:commandLink value="Esqueceu?" style="font-size: 13px; color: #6b7280; text-decoration: none;" />
            </div>
            <p:password id="password" value="#{loginBean.senha}" required="true"
                        placeholder="••••••••" toggleMask="true" />

            <p:commandButton value="Continuar" action="#{loginBean.logar}" ajax="false"
                             styleClass="btn-submit" />

            <div class="divider">
                <span>OU</span>
                <hr />
            </div>

            <p:linkButton href="formResponsavel.jsf" value="Criar conta gratuita"
                          styleClass="btn-register" />
        </h:form>

        <p class="footer-text">
            Ao continuar, você concorda com nossos Termos de Serviço.
        </p>
    </div>
</h:body>
</html>
