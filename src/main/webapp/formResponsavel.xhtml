<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:h="http://java.sun.com/jsf/html"
	  xmlns:f="http://java.sun.com/jsf/core"
	  xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Criar Conta | Gerenciador de Tarefas</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
	<h:outputStylesheet library="css" name="cadastro.css" />
	<h:outputStylesheet library="css" name="form.css" />
</h:head>

<h:body styleClass="autocadastro-bg">

	<div class="autocadastro-container">
		<div class="logo-header">
			<h:graphicImage library="img" name="icon.png" alt="Logo" />
			<h2>Comece agora</h2>
			<p>Crie sua conta para gerenciar tarefas.</p>
		</div>

		<div class="form-card">
			<h:form id="formResponsavel">
				<p:messages id="messages" closable="true"><p:autoUpdate /></p:messages>

				<h:outputLabel value="Nome Completo" styleClass="field-label" />
				<p:inputText value="#{responsavelBean.responsavel.nome}"
							 required="true"
							 placeholder="Como quer ser chamado?"
							 style="width: 100%"/>

				<h:outputLabel value="E-mail" styleClass="field-label" />
				<p:inputText value="#{responsavelBean.responsavel.usuario.email}"
							 required="true"
							 placeholder="exemplo@email.com"
							 style="width: 100%"/>

				<h:outputLabel value="Data de Nascimento" styleClass="field-label" />
				<p:calendar value="#{responsavelBean.responsavel.dataNascimento}"
							pattern="dd/MM/yyyy"
							mask="true"
							placeholder="DD/MM/AAAA"
							inputStyle="width: 100%"/>

				<div class="password-grid">
					<h:panelGroup>
						<h:outputLabel for="pwd1" value="Senha" styleClass="field-label" />
						<p:password id="pwd1" value="#{responsavelBean.responsavel.usuario.senha}"
									match="pwd2"
									label="Senha"
									required="true"
									requiredMessage="A senha é obrigatória"
									placeholder="••••••••"
									feedback="true"
									promptLabel="Mínimo 6 caracteres, com letras e números"
									weakLabel="Fraca" goodLabel="Boa" strongLabel="Forte">
							<f:validateRegex pattern="^(?=.*[A-Za-z])(?=.*\d).{6,}$" />
						</p:password>
					</h:panelGroup>

					<h:panelGroup>
						<h:outputLabel for="pwd2" value="Confirmar Senha" styleClass="field-label" />
						<p:password id="pwd2" value="#{responsavelBean.responsavel.usuario.senha}"
									label="Confirmar Senha"
									required="true"
									requiredMessage="A confirmação é obrigatória"
									placeholder="••••••••" />
					</h:panelGroup>
				</div>

				<p:commandButton action="#{responsavelBean.salvar}"
								 value="Criar minha conta"
								 styleClass="btn-primary"
								 update="@form"
								 style="width: 100%; margin-top: 25px; padding: 12px;"
								 icon="fa fa-rocket" />
			</h:form>
		</div>

		<div class="register-link">
			<h:link outcome="/login">
				Já possui uma conta? Entrar
			</h:link>
		</div>
	</div>

</h:body>
</html>
